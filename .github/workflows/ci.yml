name: CI

# Pull-request CI is split by cost. Every proposal gets the fast checks; the packaging path -- which
# needs a Windows runner for ten-plus minutes, billed at twice the Linux rate -- runs before merge only
# when artifact inputs change. A manual run always exercises it.
#
# This workflow never receives signing credentials. It references no secrets, and signing lives in
# release.yml behind an approval environment. `tests/test_ci_contract.py` enforces both, because the
# cheapest way to leak a certificate is to add "just one" secret to the workflow everyone edits.

on:
  pull_request:
  workflow_dispatch:

# Supersede a run whose commit is no longer the tip. Without this, a branch pushed several times in a
# row keeps every intermediate run alive to completion, and on Windows minutes that is most of the
# monthly budget spent on results nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      build-onedir: ${{ steps.packaging-scope.outputs.build-onedir }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect packaging-relevant changes
        id: packaging-scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $BuildOnedir = $true
          }
          else {
            $ChangedPaths = @(git diff --name-only $env:BASE_SHA $env:HEAD_SHA)
            if ($LASTEXITCODE -ne 0) { throw "Could not determine pull-request changes." }
            $ReleaseInputs = @(
              '^\.github/workflows/ci\.yml$',
              '^(pyproject\.toml|uv\.lock|MANIFEST\.in)$',
              '^(LICENSE|NOTICE|THIRD_PARTY_NOTICES\.md|LICENSING\.md|licensing\.json|third_party\.json)$',
              '^LICENSES/',
              '^tools/(build_release|sign_windows_artifact)\.ps1$',
              '^tools/(archive_release|audit_native_binaries|audit_notices|build_release_manifest|finalize_sbom|release_entry|release_identity|stage_python_runtime|verify_autocad_artifact|verify_release_manifest)\.py$',
              '^trackball_daemon/(__init__|app_registry|integrations|product)\.py$',
              '^trackball_daemon/.*\.(asmdef|cs|dll|gd|ico|json|md|png|rb|txt|uplugin|yaml|yml)$'
            )
            $BuildOnedir = [bool]($ChangedPaths | Where-Object {
              $Path = $_
              $ReleaseInputs | Where-Object { $Path -match $_ } | Select-Object -First 1
            } | Select-Object -First 1)
          }
          "build-onedir=$($BuildOnedir.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Synchronize locked Python environment
        run: uv sync --locked --all-extras --python 3.13

      - name: Compile Python sources
        run: uv run --locked --all-extras python -m compileall -q trackball_daemon tests tools

      - name: Run Python suite
        run: uv run --locked --all-extras python -m pytest -q

      - name: Run AutoCAD NavMath console suite
        run: dotnet run --project plugin_src/autocad/NavMathTests/NavMathTests.csproj --configuration Release

      - name: Build sdist and wheel
        run: uv build --out-dir build/ci-python

      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file build/ci-python/runtime-requirements.txt

      - name: Install and smoke-test the wheel outside the checkout
        shell: pwsh
        run: |
          $Wheel = (Get-ChildItem build/ci-python/*.whl | Select-Object -First 1).FullName
          if (-not $Wheel) { throw "Built wheel was not found." }
          $Requirements = (Resolve-Path build/ci-python/runtime-requirements.txt).Path
          $SbomTool = (Resolve-Path .venv/Scripts/cyclonedx-py.exe).Path
          $FinalizeSbom = (Resolve-Path tools/finalize_sbom.py).Path
          $VerifyInstalledMetadata = (Resolve-Path tools/verify_installed_metadata.py).Path
          $Pyproject = (Resolve-Path pyproject.toml).Path
          $Sbom = (Join-Path (Resolve-Path build/ci-python).Path "runtime.cdx.json")
          $Venv = Join-Path $env:RUNNER_TEMP "astrolabe-wheel-smoke"
          python -m venv $Venv
          if ($LASTEXITCODE -ne 0) { throw "Wheel smoke environment creation failed." }
          & "$Venv\Scripts\python.exe" -m pip install --require-hashes -r $Requirements
          if ($LASTEXITCODE -ne 0) { throw "Locked runtime dependency install failed." }
          & "$Venv\Scripts\python.exe" -m pip install --no-deps $Wheel
          if ($LASTEXITCODE -ne 0) { throw "Wheel installation failed." }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$Venv\Scripts\python.exe" -m trackball_daemon --release-smoke
            if ($LASTEXITCODE -ne 0) { throw "Installed wheel release smoke failed." }
            & "$Venv\Scripts\python.exe" -m trackball_daemon.validate_bindings
            if ($LASTEXITCODE -ne 0) { throw "Installed wheel binding validation failed." }
            & $SbomTool environment "$Venv\Scripts\python.exe" --pyproject $Pyproject `
              --mc-type application --spec-version 1.6 --output-format JSON `
              --output-reproducible --output-file $Sbom
            if ($LASTEXITCODE -ne 0) { throw "Installed wheel SBOM generation failed." }
            $InstalledVersion = (& "$Venv\Scripts\python.exe" -c `
              "from importlib.metadata import version; print(version('astrolabe-daemon'))").Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($InstalledVersion)) {
              throw "Installed wheel version could not be resolved."
            }
            & "$Venv\Scripts\python.exe" $FinalizeSbom --sbom $Sbom `
              --name "astrolabe-daemon" --version $InstalledVersion
            if ($LASTEXITCODE -ne 0) { throw "Installed wheel SBOM metadata finalization failed." }
            & "$Venv\Scripts\python.exe" $VerifyInstalledMetadata
            if ($LASTEXITCODE -ne 0) { throw "Installed distribution metadata verification failed." }
          }
          finally {
            Pop-Location
          }

      - name: Audit bundled-component notices against the release runtime
        shell: pwsh
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/astrolabe-release-runtime
        run: |
          uv sync --locked --no-editable --python 3.13
          if ($LASTEXITCODE -ne 0) { throw "Release runtime sync failed." }
          $RuntimePython = Join-Path $env:UV_PROJECT_ENVIRONMENT "Scripts/python.exe"
          python tools/audit_notices.py --environment $RuntimePython
          if ($LASTEXITCODE -ne 0) { throw "Bundled-component notice audit failed." }

  onedir:
    # The packaged onedir is what a user actually runs, and it is the only artifact whose build path
    # (Nuitka, data-file inclusion, packaged smoke, SBOM, manifest) is exercised nowhere else. Unsigned
    # by construction: nothing here has access to a certificate.
    #
    # Run after fast checks only for a PR that changes an artifact input. This makes packaging failures
    # pre-merge failures without paying for Nuitka on ordinary code, test, firmware, or documentation
    # changes. workflow_dispatch remains the explicit full-build path for any branch.
    needs: checks
    if: github.event_name == 'workflow_dispatch' || needs.checks.outputs.build-onedir == 'true'
    name: Unsigned onedir artifact
    runs-on: windows-latest
    # A kill switch, not an estimate: the local build takes about five minutes and a hosted runner is
    # slower. Tighten it once a few real runs have established the actual spread.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Build the unsigned release artifacts
        shell: pwsh
        run: |
          .\tools\build_release.ps1
          if ($LASTEXITCODE -ne 0) { throw "Release build failed." }

      - name: Confirm the manifest still describes the artifacts
        shell: pwsh
        run: |
          $Manifest = (Get-ChildItem build/release/*.manifest.json | Select-Object -First 1).FullName
          if (-not $Manifest) { throw "No release manifest was produced." }
          python tools/verify_release_manifest.py --manifest $Manifest --directory build/release
          if ($LASTEXITCODE -ne 0) { throw "Release manifest verification failed." }
          $Record = Get-Content $Manifest -Raw | ConvertFrom-Json
          if ($Record.signatures.signed) {
            throw "Ordinary CI produced a manifest claiming to be signed; it has no certificate."
          }
          Write-Host "$($Record.product.name) $($Record.version) ($($Record.channel)) verified"

      - name: Summarize the artifact
        shell: pwsh
        run: |
          $Manifest = (Get-ChildItem build/release/*.manifest.json | Select-Object -First 1).FullName
          $Record = Get-Content $Manifest -Raw | ConvertFrom-Json
          $Lines = @(
            "### Unsigned onedir artifact",
            "",
            "| Field | Value |",
            "|---|---|",
            "| Version | ``$($Record.version)`` |",
            "| Channel | ``$($Record.channel)`` |",
            "| Embedded Python | ``$($Record.build.embedded_python)`` |",
            "| Revision describes artifact | ``$($Record.source.revision_describes_artifact)`` |",
            "",
            "| Artifact | SHA-256 |",
            "|---|---|")
          foreach ($Name in $Record.artifacts.PSObject.Properties.Name) {
            $Entry = $Record.artifacts.$Name
            $Lines += "| ``$($Entry.path)`` | ``$($Entry.sha256)`` |"
          }
          $Lines -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Retain the unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-onedir
          retention-days: 7
          if-no-files-found: error
          path: |
            build/release/*.zip
            build/release/*.zip.sha256
            build/release/*.cdx.json
            build/release/*.manifest.json
            build/release/python/*

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # `runner` is not an available context for a job-level `env` -- only for a step's -- so it is
      # exported here instead. This was changed while investigating push-event runs that produced zero
      # jobs; that correlation is unproven, since the same construct resolved fine under
      # `pull_request`. The restriction is documented regardless, so this is the correct shape either
      # way. See TODO.md.
      - name: Use an isolated Arduino sketchbook
        run: echo "ARDUINO_DIRECTORIES_USER=$RUNNER_TEMP/astrolabe-arduino-sketchbook" >> "$GITHUB_ENV"

      - name: Install pinned Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"

      # Seeed's nRF52 core bundles adafruit-nrfutil for Windows and macOS, but its Linux
      # recipe invokes the PyPI command by name. Keep that build-only tool isolated from
      # the daemon's locked runtime and verify it before spending time on the core compile.
      - name: Set up Python for the nRF packaging tool
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned Adafruit nRF utility
        run: |
          python -m pip install "adafruit-nrfutil==0.5.3.post16"
          adafruit-nrfutil version

      - name: Install pinned validation board cores
        env:
          SEEED_INDEX: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
        run: |
          mkdir -p "$ARDUINO_DIRECTORIES_USER"
          arduino-cli core update-index --additional-urls "$SEEED_INDEX"
          arduino-cli core install "Seeeduino:nrf52@1.1.12" --additional-urls "$SEEED_INDEX"

      - name: Compile XIAO PMW3389 protocol-bench firmware
        run: |
          arduino-cli compile \
            --fqbn "Seeeduino:nrf52:xiaonRF52840:softdevice=s140v6,debug=l0" \
            --warnings all \
            --output-dir build/firmware/XIAO3389 \
            firmware/XIAO3389

      - name: Report firmware artifact sizes
        shell: bash
        run: |
          {
            echo "### Validation firmware artifacts"
            echo
            echo "| Artifact | Bytes |"
            echo "|---|---:|"
            while IFS= read -r file; do
              printf '| `%s` | %s |\n' "$file" "$(stat --format=%s "$file")"
            done < <(find build/firmware -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.hex' -o -name '*.uf2' \) | sort)
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Retain validation firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-firmware
          path: build/firmware
          if-no-files-found: error

  zmk_firmware:
    name: Pinned ZMK firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      # Immutable linux/amd64 child of zmkfirmware/zmk-build-arm:3.5.
      image: docker.io/zmkfirmware/zmk-build-arm@sha256:ba4e851529ac9a5cf6b02e7dd3297b78bd1b0e75546b9f1bb22023437836373e

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Running from firmware/zmk makes that directory the west workspace root; the local manifest
      # repository is its config/ child and upstream projects are checked out beside it.
      - name: Initialize pinned ZMK workspace
        working-directory: firmware/zmk
        run: west init -l config

      - name: Resolve pinned ZMK dependencies
        working-directory: firmware/zmk
        run: |
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      # The SPDX command's CMake file-API query must exist before the configure/build. This is why
      # the clean CI build does not use `-p always`, which would delete the query it just created.
      - name: Initialize Zephyr SPDX inventory
        working-directory: firmware/zmk
        run: west spdx --init --build-dir=build/astrolabe

      - name: Build Astrolabe for nice!nano v2
        working-directory: firmware/zmk
        run: |
          west build -s zmk/app -d build/astrolabe -b nice_nano_v2 -- \
            -DSHIELD=astrolabe \
            -DZMK_CONFIG="$GITHUB_WORKSPACE/firmware/zmk/config" \
            -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE/firmware/zmk/module"

      # Reads the address out of the artifact rather than re-asserting the overlay's constant, so it
      # catches the override being dropped, not just edited. The SuperMini's S140 7.3.0 bootloader
      # puts the application at 0x27000; upstream nice_nano_v2 says 0x26000, which lands inside the
      # SoftDevice and produces a board that never enumerates. Nothing fails at build time, so this
      # is the only place the mistake is catchable before hardware.
      - name: Assert UF2 application address
        working-directory: firmware/zmk
        shell: bash
        run: |
          set -euo pipefail
          # UF2 blocks are 512 bytes; the target address is a little-endian uint32 at offset 12.
          addr=$(python3 -c "
          import struct, sys
          with open('build/astrolabe/zephyr/zmk.uf2','rb') as f:
              block = f.read(32)
          print('0x%08X' % struct.unpack('<I', block[12:16])[0])
          ")
          echo "UF2 application address: $addr"
          if [ "$addr" != "0x00027000" ]; then
            echo "Expected 0x00027000 (S140 7.3.0). An image at 0x00026000 overlaps the" >&2
            echo "SoftDevice and will not boot. Check the shield's code_partition override." >&2
            exit 1
          fi

      # These are the descriptor-v2 development identifiers. A production VID allocation remains
      # an explicit release gate, but the daemon and firmware must agree until it is completed.
      - name: Assert development USB identity
        working-directory: firmware/zmk
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'CONFIG_USB_DEVICE_VID=0x1D50' build/astrolabe/zephyr/.config
          grep -Fx 'CONFIG_USB_DEVICE_PID=0x615E' build/astrolabe/zephyr/.config
          grep -Fx 'CONFIG_USB_DEVICE_PRODUCT="Astrolabe"' build/astrolabe/zephyr/.config

      - name: Generate Zephyr SPDX inventory
        working-directory: firmware/zmk
        run: west spdx --build-dir=build/astrolabe --analyze-includes --include-sdk

      - name: Stage firmware notices and license texts
        working-directory: firmware/zmk
        shell: bash
        run: |
          set -euo pipefail
          # Zephyr's FindZephyr-sdk module caches this as :PATH when it discovers the SDK through
          # the CMake package registry, which is how the build container provides it. It is only
          # :INTERNAL when ZEPHYR_SDK_INSTALL_DIR came from the environment, which is what a local
          # developer build usually does -- so matching :INTERNAL alone passed by hand and left
          # sdk_dir empty here. Match whatever type CMake chose, and say so if it is missing
          # rather than exiting silently on `test -n`.
          sdk_dir="$(sed -n 's/^ZEPHYR_SDK_INSTALL_DIR:[^=]*=//p' build/astrolabe/CMakeCache.txt | head -n1)"
          if [ -z "$sdk_dir" ]; then
            echo "ZEPHYR_SDK_INSTALL_DIR is absent from build/astrolabe/CMakeCache.txt" >&2
            grep -i 'ZEPHYR_SDK\|CMAKE_C_COMPILER:' build/astrolabe/CMakeCache.txt >&2 || true
            exit 1
          fi
          # Only components that ship a single canonical upstream license file are compared here.
          # nrfx and micro-ecc do not: their notices are extracted from source headers, so those
          # texts are pinned by content hash in tests/test_zmk_contract.py instead. Adding them to
          # this list would require inventing an upstream file to compare against.
          cmp ../../LICENSES/third-party/zmk.txt zmk/LICENSE
          cmp ../../LICENSES/third-party/zephyr.txt zephyr/LICENSE
          cmp ../../LICENSES/third-party/cmsis.txt modules/hal/cmsis/LICENSE.txt
          cmp ../../LICENSES/third-party/tinycrypt.txt modules/crypto/tinycrypt/README.zephyr
          cmp ../../LICENSES/third-party/picolibc.txt \
            "$sdk_dir/arm-zephyr-eabi/share/licenses/picolibc/COPYING.picolibc"
          cmp ../../LICENSES/third-party/newlib.txt \
            "$sdk_dir/arm-zephyr-eabi/share/licenses/picolibc/COPYING.NEWLIB"
          cmp ../../LICENSES/third-party/gcc-gpl-3.0.txt \
            "$sdk_dir/arm-zephyr-eabi/share/licenses/gcc/COPYING3"
          cmp ../../LICENSES/third-party/gcc-runtime-library-exception-3.1.txt \
            "$sdk_dir/arm-zephyr-eabi/share/licenses/gcc/COPYING.RUNTIME"
          compliance=build/astrolabe/compliance
          mkdir -p "$compliance"
          cp \
            ../../LICENSE \
            ../../NOTICE \
            ../../LICENSING.md \
            ../../THIRD_PARTY_NOTICES.md \
            ../../third_party.json \
            "$compliance/"
          cp -R ../../LICENSES "$compliance/LICENSES"

      - name: Freeze ZMK build provenance
        working-directory: firmware/zmk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/astrolabe/provenance
          # --resolve, not --freeze: freeze insists every project in the manifest be cloned so it
          # can read a SHA out of each working tree, and dies on the optional Zephyr modules this
          # build deliberately never clones ("cannot freeze; project chre is uncloned"). It buys
          # nothing here anyway -- every revision the resolved manifest emits is already a pinned
          # 40-hex SHA, so the two agree on provenance. west list below records what was actually
          # checked out, which is the part that describes this build rather than the manifest.
          west manifest --resolve > build/astrolabe/west-resolved.yml
          west list -f $'{name}\t{revision}\t{path}' > build/astrolabe/provenance/west-projects.tsv
          cp config/west.yml build/astrolabe/provenance/source-west.yml
          printf '%s\n' \
            "repository_revision=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            'container=docker.io/zmkfirmware/zmk-build-arm@sha256:ba4e851529ac9a5cf6b02e7dd3297b78bd1b0e75546b9f1bb22023437836373e' \
            'board=nice_nano_v2' \
            'shield=astrolabe' \
            > build/astrolabe/provenance/build.txt
          (
            cd build/astrolabe
            {
              sha256sum \
              zephyr/zmk.uf2 \
              zephyr/zmk.elf \
              zephyr/zmk.map \
              zephyr/.config \
              zephyr/zephyr.dts \
              compile_commands.json \
              west-resolved.yml \
              spdx/app.spdx \
              spdx/zephyr.spdx \
              spdx/build.spdx \
              spdx/sdk.spdx \
              compliance/LICENSE \
              compliance/NOTICE \
              compliance/LICENSING.md \
              compliance/THIRD_PARTY_NOTICES.md \
              compliance/third_party.json \
              provenance/source-west.yml \
              provenance/west-projects.tsv \
              provenance/build.txt
              find compliance/LICENSES -type f -print0 | sort -z | xargs -0 sha256sum
            } > provenance/sha256sums.txt
          )

      - name: Retain ZMK firmware and provenance
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          if-no-files-found: error
          include-hidden-files: true
          path: |
            firmware/zmk/build/astrolabe/zephyr/zmk.uf2
            firmware/zmk/build/astrolabe/zephyr/zmk.elf
            firmware/zmk/build/astrolabe/zephyr/zmk.map
            firmware/zmk/build/astrolabe/zephyr/.config
            firmware/zmk/build/astrolabe/zephyr/zephyr.dts
            firmware/zmk/build/astrolabe/compile_commands.json
            firmware/zmk/build/astrolabe/west-resolved.yml
            firmware/zmk/build/astrolabe/spdx/*.spdx
            firmware/zmk/build/astrolabe/compliance/**
            firmware/zmk/build/astrolabe/provenance/*
