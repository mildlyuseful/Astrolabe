name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Python package and test runner
        run: python -m pip install -e .[dev]

      - name: Compile Python sources
        run: python -m compileall -q trackball_daemon tests

      - name: Run Python suite
        run: python -m pytest -q

      - name: Run AutoCAD NavMath console suite
        run: dotnet run --project plugin_src/autocad/NavMathTests/NavMathTests.csproj --configuration Release
