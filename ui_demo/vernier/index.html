<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrolabe — Settings (Vernier UI study)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

    </g>
    <g id="i-state" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/>

    <g id="i-trash" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.6 4.6h10.8M6.4 4.6V2.9h3.2v1.7M4.2 4.6l.7 8.5h6.2l.7-8.5"/>
    </g>
    <g id="i-record" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.4" fill="currentColor" stroke="none"/>

    <g id="i-up" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.6L8 5.6l4 4"/></g>
    <g id="i-down" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.4l4 4 4-4"/></g>
    <g id="i-shield" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M8 1.8l5 1.8v4.1c0 3.1-2.1 5.3-5 6.5-2.9-1.2-5-3.4-5-6.5V3.6z"/>
    </g>
    <g id="i-download" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2.4v7.2M5 6.8L8 9.8l3-3M3 12.8h10"/>
    </g>
    <g id="i-power" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M8 2.2v5"/><path d="M4.4 4.6a5 5 0 107.2 0"/>
    </g>
    <g id="i-folder" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">

      <rect x="3.4" y="7" width="9.2" height="6.6" rx="1.3"/><path d="M5.6 7V5.2a2.4 2.4 0 014.8 0V7"/>
    </g>
    <g id="i-eye" fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M1.6 8S4.1 3.8 8 3.8 14.4 8 14.4 8 11.9 12.2 8 12.2 1.6 8 1.6 8z"/><circle cx="8" cy="8" r="1.9"/>

</svg>

<div class="app" id="app">
  <header class="titlebar">
    <span class="mark"><svg width="17" height="17" viewBox="0 0 16 16"><use href="#i-mark"/></svg></span>
    <span class="wordmark">Astrolabe</span>
    <span class="chip" id="version-chip"></span>
    <span class="spacer"></span>
    <span class="statuspill" id="status-pill" title="BLE transport state"></span>
    <button class="iconbtn" id="theme-btn" title="Light / dark"></button>
    <button class="iconbtn" id="tray-btn" title="Tray menu">
      <svg width="15" height="15" viewBox="0 0 16 16"><use href="#i-menu"/></svg>
    </button>
  </header>

  <div class="body">
    <nav class="rail" id="rail" role="tablist" aria-label="Panels">
      <span class="rail-indicator" id="rail-indicator"></span>
    </nav>
    <div class="main">
      <div class="panelhead" id="panelhead"></div>
      <div class="subtabs" id="subtabs" role="tablist">
        <span class="sub-indicator" id="sub-indicator"></span>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
  <div class="toasts" id="toasts"></div>
</div>

<!-- the passive control panel, drawn where it actually lives: over the desktop -->
<div class="hud" id="hud"></div>

<p class="demo-note">
  <svg width="13" height="13" viewBox="0 0 16 16"><use href="#i-info"/></svg>
  Static UI study — nothing is wired to a daemon. Window frame is held at
  <span class="mono">1010 × 632</span>, a quarter of a 1080p desktop, so every panel has to fit without scrolling.
</p>

<script src="data.js"></script>
<script src="ball.js"></script>
<script src="app.js"></script>
</body>
</html>
