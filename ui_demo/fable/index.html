<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrolabe — Control Daemon</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="desktop">
  <div class="window" id="app">

    <header class="titlebar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="30" r="17" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <line x1="9.4" y1="21.8" x2="54.6" y2="38.2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">ASTROLABE</span>
        <span class="brand-sub">control daemon</span>
      </div>
      <div class="titlebar-right">
        <div class="conn-pill" title="BLE link status">
          <span class="conn-dot"></span>Connected
        </div>
        <button class="win-btn" id="btn-hide" title="Closing hides to the tray — the daemon keeps running" aria-label="Hide to tray">
          <svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="navbar">
      <div class="tabs" id="nav">
        <span class="nav-underline" id="nav-underline"></span>
        <button class="tab" data-route="overview">Overview</button>
        <button class="tab" data-route="apps">3D Apps</button>
        <button class="tab" data-route="bindings">Bindings</button>
        <button class="tab" data-route="general">General</button>
      </div>
      <div class="mode-toggle" id="mode-toggle" role="radiogroup" aria-label="Input mode"
           title="Global input mode — also toggleable from the tray">
        <div class="mode-thumb" id="mode-thumb"></div>
        <button data-mode="cursor" role="radio">Cursor</button>
        <button data-mode="cube" role="radio">3D&nbsp;Nav</button>
      </div>
    </nav>

    <div class="content" id="view"></div>

    <footer class="statusbar">
      <span>Connection: connected — Trackball BLE (notify 7 ms)</span>
      <span class="mono" id="status-apps">Apps: blender v0.1.12</span>
      <span class="status-right">
        <button class="quit-link" id="btn-quit">Quit daemon</button>
        <span class="status-demo">UI demo — drives nothing</span>
      </span>
    </footer>

  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="app.js"></script>
</body>
</html>
