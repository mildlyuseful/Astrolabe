CONFIG_ASTROLABE=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_BT_DEVICE_NAME="Astrolabe"
CONFIG_BT_DEVICE_APPEARANCE=962

# Global Zephyr USB-HID symbols, so they also apply to ZMK's own interface: it gets an OUT endpoint
# it never uses. Only the Astrolabe vendor interface needs one, for daemon commands.
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_HID_INTERRUPT_EP_MPS=16
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_HID_REPORTS=5
