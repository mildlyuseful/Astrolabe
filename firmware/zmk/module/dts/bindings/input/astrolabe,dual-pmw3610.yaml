description: Astrolabe dual PMW3610 composite pointing device
compatible: "astrolabe,dual-pmw3610"

include: base.yaml

properties:
  sclk-gpios:
    type: phandle-array
    required: true
  sdio-gpios:
    type: phandle-array
    required: true
  cs-gpios:
    type: phandle-array
    required: true
  motion-gpios:
    type: phandle-array
    required: true
  cpi:
    type: int
    required: true
  ball-diameter-um:
    type: int
    required: true
  sensor-phi-mdeg:
    type: array
    required: true
  sensor-theta-mdeg:
    type: array
    required: true
  sensor-mount-mdeg:
    type: array
    required: true
  sensor-flipped:
    type: array
    required: true
  frame-tilt-mdeg:
    type: int
    required: true
  poll-interval-us:
    type: int
    default: 1000
  active-window-ms:
    type: int
    default: 2000
  send-interval-ms:
    type: int
    default: 7
  cursor-gain-milli:
    type: int
    required: true
  scroll-gain-milli:
    type: int
    required: true
  scroll-divisor:
    type: int
    required: true
  yaw-deadzone-milli:
    type: int
    required: true
  yaw-dominance-milli:
    type: int
    required: true
  scroll-hold-ms:
    type: int
    required: true

