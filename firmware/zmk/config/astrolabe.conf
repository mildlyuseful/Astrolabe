CONFIG_ASTROLABE_FIRMWARE=y
CONFIG_ASTROLABE_GATT=y
CONFIG_ASTROLABE_USB=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_BT_DEVICE_NAME="Astrolabe"
CONFIG_BT_DEVICE_APPEARANCE=962

# These are global Zephyr USB-HID symbols, not per-instance: they apply to ZMK's own keyboard
# interface as well as the Astrolabe vendor interface. The OUT endpoint is only used by the vendor
# interface for ownership commands, so ZMK's interface gets an unused one. That costs an endpoint
# pair, which nRF52840 has room for; it is called out here so the cost is not mistaken for a
# requirement of ZMK's interface.
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_HID_INTERRUPT_EP_MPS=16
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_HID_REPORTS=5
