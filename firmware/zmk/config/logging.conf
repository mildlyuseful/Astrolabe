#
# Opt-in diagnostic fragment. NOT part of the default build -- it adds a USB CDC ACM console,
# which costs flash, RAM, and two extra USB interfaces, and it must not ship on hardware.
#
#   west build ... -S zmk-usb-logging -- -DEXTRA_CONF_FILE="$PWD/config/logging.conf" ...
#
# The zmk-usb-logging snippet supplies the CDC ACM devicetree node and console chosen-nodes;
# CONFIG_ZMK_USB_LOGGING alone fails Kconfig because USB_CDC_ACM needs that node to exist.
#
# Logs appear on the COM port the board enumerates alongside its HID interfaces.

# 4 = debug, so the control-transfer and sensor-identification paths are visible.
CONFIG_ASTROLABE_LOG_LEVEL=4
