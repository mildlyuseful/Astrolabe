[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trackball-daemon"
dynamic = ["version"]   # single source: trackball_daemon.__init__.__version__ (shown in the tray)
license = "Apache-2.0"
# Explicit rather than left to setuptools' default glob, which finds LICENSE and NOTICE but not the
# third-party attributions or the texts they point at. LICENSING.md maps every path to its license.
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSING.md", "LICENSES/**"]
description = "System-tray daemon for the dual-sensor BLE trackball (mouse + 3D navigation)."
requires-python = ">=3.13"
dependencies = [
    # Ceiling is deliberate, not staleness: bleak 2.0 changed GATT error types and 3.0 changed the
    # scanner/client keyword surface. Moving off 1.x changes the BLE transport and can only be
    # qualified against real trackball hardware, so it is tracked as its own task in TODO.md.
    "bleak>=1.1,<2",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "pywin32>=306; sys_platform == 'win32'",   # SolidWorks COM automation (win32com)
]

[project.optional-dependencies]
debug = ["pygame>=2.5.0", "PyOpenGL>=3.1.7"]
# Onshape bridge cert generation; without it the bridge falls back to an `openssl` CLI on PATH.
onshape = ["cryptography>=41.0; sys_platform == 'win32'"]
dev = ["pytest", "jsonschema[format]"]
release = ["nuitka", "cyclonedx-bom==7.3.0", "setuptools==82.0.1"]

# GUI script -> launched without a console window on Windows.
[project.gui-scripts]
trackball-daemon = "trackball_daemon.__main__:main"

[project.scripts]
trackball-validate-bindings = "trackball_daemon.validate_bindings:main"

[tool.setuptools.packages.find]
include = ["trackball_daemon*"]

[tool.setuptools.dynamic]
version = {attr = "trackball_daemon.__version__"}

# Ship the bundled CAD add-ins (e.g. the Fusion 360 add-in) inside the package so
# "Set up" can copy them out, and so Nuitka onedir includes them.
[tool.setuptools.package-data]
trackball_daemon = ["host_profiles.json", "default_profiles.json", "system_defaults.json", "system_keybinding_profiles.json", "plugins/**/*", "devices/descriptor_data/*.json", "schemas/*.schema.json", "examples/*.example.json"]

[tool.setuptools.exclude-package-data]
trackball_daemon = ["**/__pycache__/*", "**/*.pyc", "**/*.pyc.*", "**/*.pyo"]

# Keep test collection inside tests/ -- otherwise pytest's default *_test.py glob would also
# import the standalone cube_test.py demo (pulls in pygame, slow, side-effects).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.28"
build-constraint-dependencies = ["setuptools==82.0.1"]
